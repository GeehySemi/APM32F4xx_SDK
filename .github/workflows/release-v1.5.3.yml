name: Publish APM32F4xx SDK V1.5.3

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/release-v1.5.3.yml"

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify official package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 \
            -o APM32F4xx_SDK_V1.5.3.zip \
            "https://global.geehy.com/uploads/tool/APM32F4xx_SDK_V1.5.3.zip"
          printf '%s  %s\n' \
            "2d9200402bc1247c55b547aa65ce3917c33c47e111f1d46b1b1c32a33449dd03" \
            "APM32F4xx_SDK_V1.5.3.zip" | sha256sum --check -

      - name: Create annotated version tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v1.5.3" "a77efdade76880dcfaf2dd46d3da42bb3c0150d9" \
            -m "APM32F4xx SDK V1.5.3"
          git push origin "refs/tags/v1.5.3"

      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "Official APM32F4xx SDK V1.5.3 from Geehy Semiconductor." \
            "" \
            "- Official package date: July 3, 2026" \
            "- Release notes date: June 16, 2026" \
            "- Package SHA-256: \`2d9200402bc1247c55b547aa65ce3917c33c47e111f1d46b1b1c32a33449dd03\`" \
            "- Source: https://global.geehy.com/uploads/tool/APM32F4xx_SDK_V1.5.3.zip" \
            "" \
            "Use of the SDK is subject to the Geehy Semiconductor Software License Agreement and the third-party licenses included in the package." \
            > release-notes.md
          gh release create "v1.5.3" \
            "APM32F4xx_SDK_V1.5.3.zip" \
            --repo "GeehySemi/APM32F4xx_SDK" \
            --target "a77efdade76880dcfaf2dd46d3da42bb3c0150d9" \
            --title "APM32F4xx SDK V1.5.3" \
            --notes-file release-notes.md

      - name: Remove temporary release workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/release-v1.5.3.yml
          git add -A
          git commit -m "Remove temporary release workflow"
          git push origin HEAD:main
